[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lens"
version = "0.1.0"
description = "100% offline screen capture & local VLM overlay assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "PyQt6>=6.6.0",
    "mss>=9.0.1",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "pynput>=1.7.6",
    "httpx>=0.27.0",
]

[project.scripts]
ai-lens = "ai_lens.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_lens*"]
